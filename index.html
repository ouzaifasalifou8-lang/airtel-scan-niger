<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airtel Scan Niger</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ed1c24">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        :root { --airtel-red: #ed1c24; --dark: #121212; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .header { background: var(--airtel-red); width: 100%; padding: 15px 0; text-align: center; font-weight: bold; font-size: 20px; }
        #video-container { position: relative; width: 90%; max-width: 400px; margin-top: 20px; border-radius: 15px; overflow: hidden; border: 2px solid #333; }
        video { width: 100%; display: block; }
        .scanner-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 60px; border: 2px solid yellow; box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); pointer-events: none; }
        #status { margin: 15px; font-size: 14px; color: #bbb; text-align: center; }
        .btn { width: 85%; max-width: 350px; padding: 18px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        #capture-btn { background: white; color: black; }
        #recharge-btn { background: var(--airtel-red); color: white; display: none; }
        #result-text { font-size: 28px; color: #ffd700; margin-top: 10px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="header">AIRTEL SCAN NIGER</div>

    <div id="video-container">
        <video id="video" autoplay playsinline></video>
        <div class="scanner-overlay"></div>
    </div>

    <div id="status">Prêt pour le scan</div>
    <div id="result-text"></div>

    <button id="capture-btn" class="btn">SCANNER LA CARTE</button>
    <a id="recharge-btn" class="btn">RECHARGER MAINTENANT</a>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture-btn');
        const rechargeBtn = document.getElementById('recharge-btn');
        const status = document.getElementById('status');
        const resultText = document.getElementById('result-text');

        // Accès Caméra
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { status.innerText = "Erreur caméra : " + err; });

        captureBtn.onclick = async () => {
            status.innerText = "Analyse en cours...";
            captureBtn.disabled = true;
            captureBtn.style.opacity = "0.5";

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            try {
                const result = await Tesseract.recognize(canvas, 'eng', {
                    tessedit_char_whitelist: '0123456789'
                });
                
                const digits = result.data.text.replace(/\D/g, '');
                
                if (digits.length >= 10) {
                    if ("vibrate" in navigator) navigator.vibrate(200);
                    resultText.innerText = digits;
                    rechargeBtn.href = `tel:*136*${digits}%23`;
                    rechargeBtn.style.display = "flex";
                    status.innerText = "Code détecté !";
                } else {
                    status.innerText = "Code non reconnu. Essayez de mieux éclairer la carte.";
                }
            } catch (e) {
                status.innerText = "Erreur de traitement.";
            } finally {
                captureBtn.disabled = false;
                captureBtn.style.opacity = "1";
            }
        };

        // Installation Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
